[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "tau2",
    "litellm>=1.80.15,<1.82.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
jev = [
    "typesafe-sdk>=0.7.5",
]

[tool.uv.sources]
tau2 = { path = "../tau2-bench", editable = true }

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.pyright]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[[tool.mypy.overrides]]
module = ["tau2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# tau2-bench/src is listed explicitly so tests do not depend on the venv's
# editable .pth file: on macOS with ~/Documents synced to iCloud that file gets
# the hidden flag, and Python 3.12 silently skips hidden .pth files.
pythonpath = ["src", "../tau2-bench/src"]
testpaths = ["tests"]
