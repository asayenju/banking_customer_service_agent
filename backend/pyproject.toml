[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "tau2",
]

[tool.uv.sources]
tau2 = { path = "../tau2-bench", editable = true }

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.pyright]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[[tool.mypy.overrides]]
module = ["tau2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
