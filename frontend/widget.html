<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rho-Bank assistant demo</title>
<style>
  :root { --bg:#f4f6fa; --ink:#1b2430; --muted:#6b7686; --line:#dde3ec; --brand:#1f5fbf; --me:#1f5fbf; --bot:#eef2f8; --warn:#b3261e; --ok:#1a7f4b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#10151d; --ink:#e7ecf3; --muted:#93a0b2; --line:#263040; --bot:#1a2230; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:640px; padding:48px 24px; }
  main h1 { margin:0 0 8px; font-size:28px; }
  main p { color:var(--muted); }

  #tab { position:fixed; right:0; top:40%; transform:rotate(-90deg); transform-origin:100% 100%; background:var(--brand); color:#fff;
         border:0; padding:8px 18px; border-radius:10px 10px 0 0; cursor:pointer; font:600 14px system-ui; }
  #panel { position:fixed; right:16px; bottom:16px; width:340px; height:min(560px,calc(100vh - 32px)); display:none; flex-direction:column;
           background:var(--bg); border:1px solid var(--line); border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.18); overflow:hidden; }
  #panel.open { display:flex; }
  header { display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--brand); color:#fff; }
  header b { flex:1; font-size:15px; }
  header button, header select { background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:6px; padding:4px 8px; font:inherit; font-size:12px; cursor:pointer; }
  header select option { color:#000; }
  #who { padding:8px 12px; font-size:12px; color:var(--muted); border-bottom:1px solid var(--line); }
  #who b { color:var(--ink); }
  #log { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .m { max-width:86%; padding:8px 11px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; }
  .me { align-self:flex-end; background:var(--me); color:#fff; border-bottom-right-radius:3px; }
  .bot { align-self:flex-start; background:var(--bot); border-bottom-left-radius:3px; }
  .tag { align-self:flex-start; font-size:11px; padding:1px 8px; border-radius:99px; border:1px solid var(--warn); color:var(--warn); }
  .tag.ok { border-color:var(--ok); color:var(--ok); }
  #chips { display:flex; flex-wrap:wrap; gap:6px; padding:6px 12px 0; }
  #chips button { font:12px system-ui; padding:3px 9px; border-radius:99px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; }
  form { display:flex; gap:6px; padding:10px 12px; }
  input { flex:1; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--ink); font:inherit; }
  form button { border:0; background:var(--brand); color:#fff; border-radius:8px; padding:0 14px; font:600 14px system-ui; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .dots::after { content:"..."; animation:d 1s steps(4) infinite; }
  @keyframes d { 0% { content:"" } 33% { content:"." } 66% { content:".." } 100% { content:"..." } }
</style>
</head>
<body>
<main>
  <h1>Rho-Bank</h1>
  <p>Demo page. Open the assistant on the right and pick a sample customer.</p>
</main>

<button id="tab">Chat with us</button>
<section id="panel" aria-label="Assistant">
  <header>
    <b>Rho-Bank assistant</b>
    <select id="scenario" title="Sample customer">
      <option value="wallet">Lost wallet</option>
      <option value="dispute">Card dispute</option>
    </select>
    <button id="reset" title="Start a new conversation">New</button>
    <button id="close" title="Close">x</button>
  </header>
  <div id="who"></div>
  <div id="log" aria-live="polite"></div>
  <div id="chips"></div>
  <form id="form"><input id="text" autocomplete="off" placeholder="Type a message"><button id="send">Send</button></form>
</section>

<script>
const SAMPLES = {
  wallet: {
    who: "<b>Mei-Lin Chen</b> · phone 619-555-0284 · email meiling.chen@outlook.com · born 07/18/1991 · 3245 Sunset Boulevard, San Diego, CA 92103",
    chips: [
      ["Report the loss", "I lost my wallet with my Light Blue, Green and Light Green debit cards. Please freeze them right now."],
      ["Verify me", "My phone is 619-555-0284 and my email is meiling.chen@outlook.com"],
      ["It's definite", "Yes, they are definitely gone. Please cancel them and send replacements."],
      ["No credit card", "No credit card was in the wallet."],
      ["Decline the fee", "No, I don't want to pay the $25 fee."],
      ["Yes", "Yes, go ahead."]
    ]
  },
  dispute: {
    who: "<b>Valeria Montes</b> · phone 312-555-7294 · email valeria.montes@finmail.com · born 06/18/1991 · 4521 Lakeview Drive, Chicago, IL 60614",
    chips: [
      ["Ask for a dispute", "I need to dispute a charge on my debit card."],
      ["Verify me", "My phone is 312-555-7294 and my email is valeria.montes@finmail.com"],
      ["Duplicate charge", "Bella's Bistro charged me $47.50 twice on November 6th. I noticed on November 10th."],
      ["Wrong amount", "Whole Foods charged me $189.23 but it should have been $89.23."],
      ["Statement ok", "Yes, you can use this conversation as my written statement."],
      ["Yes", "Yes, go ahead."]
    ]
  }
};
const $ = id => document.getElementById(id);
let convo = null;

const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
function add(kind, text) {
  const d = document.createElement("div"); d.className = "m " + kind; d.textContent = text;
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight; return d;
}
function tag(text, ok) {
  const d = document.createElement("div"); d.className = "tag" + (ok ? " ok" : ""); d.textContent = text;
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
}
function reset() {
  const s = $("scenario").value;
  convo = { id: newId(), first: true };
  $("log").innerHTML = "";
  $("who").innerHTML = "Playing " + SAMPLES[s].who;
  $("chips").innerHTML = "";
  for (const [label, text] of SAMPLES[s].chips) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = label;
    b.onclick = () => { $("text").value = text; $("text").focus(); };
    $("chips").appendChild(b);
  }
  add("bot", "Hi, I'm the Rho-Bank assistant. How can I help?");
}
async function send(text) {
  $("send").disabled = true;
  add("me", text);
  const wait = add("bot", ""); wait.classList.add("dots");
  const body = { message_id: newId(), message: text };
  if (convo.first) body.scenario = $("scenario").value;
  try {
    const r = await fetch("/conversations/" + convo.id + "/messages", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    convo.first = false;
    const data = await r.json();
    wait.classList.remove("dots");
    const extra = data.questions.filter(q => !data.reply.includes(q));
    wait.textContent = [data.reply, ...extra].filter(Boolean).join("\n\n") || "(no reply)";
    if (data.escalated) tag("Passed to a person", false);
    if (data.failed) tag("Something could not be done", false);
  } catch (e) {
    wait.classList.remove("dots"); wait.textContent = "Sorry, that did not work (" + e.message + ").";
  }
  $("send").disabled = false; $("text").focus();
}
$("form").onsubmit = e => { e.preventDefault(); const t = $("text").value.trim(); if (t && !$("send").disabled) { $("text").value = ""; send(t); } };
$("reset").onclick = reset; $("scenario").onchange = reset;
$("tab").onclick = () => { $("panel").classList.add("open"); $("tab").style.display = "none"; $("text").focus(); };
$("close").onclick = () => { $("panel").classList.remove("open"); $("tab").style.display = ""; };
reset();
</script>
</body>
</html>
