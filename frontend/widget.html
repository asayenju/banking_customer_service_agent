<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banking customer service agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root {
    --page:#f6f7f9; --panel:#ffffff; --ink:#101828; --muted:#667085; --line:#e3e7ee; --soft:#f2f4f8;
    --accent:#2748e0; --accent-ink:#ffffff; --ok:#0f8f6b; --ok-bg:#e8f6f1; --warn:#b45f06; --warn-bg:#fdf1e1;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 12px 32px rgba(16,24,40,.08);
    --sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --serif:"Instrument Serif",Georgia,serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --page:#0b0f17; --panel:#121826; --ink:#eef1f6; --muted:#97a1b3; --line:#232c3d; --soft:#1a2233;
            --accent:#6f8bff; --accent-ink:#0b0f17; --ok:#4cd2a6; --ok-bg:#12302a; --warn:#f0a855; --warn-bg:#352612; --shadow:none; }
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--page); color:var(--ink); font:15px/1.55 var(--sans); -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------- the page around the assistant ---------- */
  .stage { min-height:100%; padding:48px clamp(24px,4vw,56px); margin-right:min(520px,100vw); }
  .stage h1 { font:400 44px/1.1 var(--serif); margin:0 0 10px; letter-spacing:-.01em; }
  .stage > p { color:var(--muted); margin:0 0 32px; max-width:56ch; }
  .find { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:0 0 14px; }
  .find input { flex:1; min-width:200px; border:1px solid var(--line); border-radius:11px; padding:9px 13px; background:var(--panel); color:var(--ink); font:inherit; }
  .areas { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 18px; }
  .areas button { border:1px solid var(--line); background:transparent; border-radius:99px; padding:4px 12px; font-size:13px; cursor:pointer; color:var(--muted); }
  .areas button[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:var(--page); }
  .count { color:var(--muted); font-size:13.5px; margin:0 0 12px; }
  .people { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; align-items:start; }
  .person { text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; cursor:pointer; display:block; width:100%; }
  .person:hover { border-color:var(--muted); }
  .person[aria-pressed="true"] { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .person b { display:block; font-weight:600; }
  .person .tags { font-size:12.5px; color:var(--accent); margin:1px 0 6px; }
  .person .about { font-size:13.5px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .person .id { font-size:12.5px; color:var(--muted); margin-top:8px; overflow-wrap:anywhere; }
  .more { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); cursor:default; }
  .blk h3 { margin:0 0 2px; font-size:13px; font-weight:600; }
  .blk p { margin:0 0 10px; font-size:13.5px; color:var(--muted); overflow-wrap:anywhere; white-space:pre-line; }
  .fill { display:flex; gap:6px; margin-top:10px; }
  .fill span { font-size:12.5px; font-weight:600; border:1px solid var(--line); border-radius:8px; padding:3px 9px; color:var(--ink); }
  .fill span:hover { border-color:var(--accent); color:var(--accent); }
  @media (max-width:1000px) { .stage { display:none; } }

  /* ---------- the docked assistant ---------- */
  aside { position:fixed; top:0; right:0; bottom:0; width:min(520px,100vw); display:flex; flex-direction:column; background:var(--panel);
          border-left:1px solid var(--line); box-shadow:var(--shadow); }
  .top { display:flex; align-items:center; gap:12px; padding:16px 20px 12px; }
  .mark { width:34px; height:34px; border-radius:10px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font:400 21px/1 var(--serif); }
  .top .name { flex:1; line-height:1.25; }
  .top .name b { display:block; font-weight:600; }
  .top .name span { font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .top .name span::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--ok); }
  .icon { border:1px solid var(--line); background:transparent; border-radius:9px; height:34px; padding:0 12px; cursor:pointer; color:var(--muted); font-size:13px; }
  .icon:hover { color:var(--ink); border-color:var(--muted); }
  .pick { display:none; margin:0 20px 12px; padding:9px 12px; border-radius:11px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font:inherit; }
  @media (max-width:1000px) { .pick { display:block; } }
  .seg { display:flex; gap:4px; margin:0 20px 12px; padding:4px; background:var(--soft); border-radius:11px; }
  .seg button { flex:1; border:0; background:transparent; border-radius:8px; padding:6px 8px; cursor:pointer; color:var(--muted); font-weight:500; font-size:13.5px; }
  .seg button[aria-pressed="true"] { background:var(--panel); color:var(--ink); box-shadow:0 1px 2px rgba(16,24,40,.1); }

  #log { flex:1; overflow-y:auto; padding:8px 20px 16px; display:flex; flex-direction:column; gap:18px; scroll-behavior:smooth; }
  .row { display:flex; gap:10px; max-width:100%; }
  .row.me { justify-content:flex-end; }
  .bubble { max-width:82%; padding:10px 14px; border-radius:16px 16px 4px 16px; background:var(--accent); color:var(--accent-ink); white-space:pre-wrap; word-wrap:break-word; }
  .says { max-width:100%; white-space:pre-wrap; word-wrap:break-word; }
  .says p { margin:0 0 8px; } .says p:last-child { margin:0; }
  .hello { font:400 30px/1.15 var(--serif); margin:6px 0 0; letter-spacing:-.01em; }
  .hello + p { color:var(--muted); margin:6px 0 0; }
  .notice { align-self:flex-start; font-size:13px; padding:4px 10px; border-radius:99px; background:var(--warn-bg); color:var(--warn); font-weight:500; }
  .typing { display:flex; gap:4px; padding:6px 0; }
  .typing i { width:6px; height:6px; border-radius:50%; background:var(--muted); animation:b 1.1s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay:.15s; } .typing i:nth-child(3) { animation-delay:.3s; }
  @keyframes b { 0%,60%,100% { opacity:.25; transform:none } 30% { opacity:1; transform:translateY(-3px) } }

  /* the review card: the moment that matters */
  .card { border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--panel); box-shadow:0 1px 2px rgba(16,24,40,.05); }
  .card > header { padding:12px 16px; background:var(--soft); font-weight:600; border-bottom:1px solid var(--line); }
  .step { display:flex; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); }
  .step:last-of-type { border-bottom:0; }
  .step .what { flex:1; min-width:0; }
  .step .what div { overflow-wrap:anywhere; }
  .chip { flex:none; align-self:flex-start; font-size:12px; font-weight:600; padding:2px 8px; border-radius:99px; white-space:nowrap; }
  .chip.undo { background:var(--ok-bg); color:var(--ok); }
  .chip.final { background:var(--warn-bg); color:var(--warn); }
  details { margin-top:4px; } summary { cursor:pointer; color:var(--muted); font-size:12.5px; }
  details p { margin:4px 0 0; font-size:12.5px; color:var(--muted); overflow-wrap:anywhere; }
  .left-out { padding:12px 16px; font-size:13.5px; color:var(--muted); border-top:1px solid var(--line); background:var(--soft); }
  .left-out b { color:var(--ink); font-weight:600; }
  .actions { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  .primary { flex:1; border:0; background:var(--accent); color:var(--accent-ink); border-radius:10px; padding:10px 14px; font-weight:600; cursor:pointer; }
  .ghost { border:1px solid var(--line); background:transparent; border-radius:10px; padding:10px 14px; cursor:pointer; color:var(--muted); font-weight:500; }
  .actions button:disabled { opacity:.45; cursor:default; }
  .done { border-color:var(--ok); }
  .done > header { background:var(--ok-bg); color:var(--ok); }
  .done li { margin:0 0 4px; }
  .done ul { margin:0; padding:12px 16px 12px 34px; }
  .after { padding:0 16px 14px; color:var(--muted); font-size:13.5px; }

  /* composer */
  .tips { display:none; gap:6px; padding:0 20px 8px; overflow-x:auto; }
  .tips button { flex:none; border:1px solid var(--line); background:transparent; border-radius:99px; padding:4px 11px; font-size:12.5px; cursor:pointer; color:var(--muted); }
  @media (max-width:1000px) { .tips { display:flex; } }
  form { display:flex; gap:8px; padding:12px 20px 18px; border-top:1px solid var(--line); }
  textarea { flex:1; min-width:0; resize:none; overflow-y:auto; max-height:9.5em; border:1px solid var(--line); border-radius:12px; padding:11px 14px; background:var(--panel); color:var(--ink); font:inherit; line-height:1.45; white-space:pre-wrap; overflow-wrap:anywhere; }
  textarea::placeholder { color:var(--muted); }
  form { align-items:flex-end; }
  #send { height:44px; border:0; border-radius:12px; padding:0 18px; background:var(--accent); color:var(--accent-ink); font-weight:600; cursor:pointer; }
  #send:disabled { opacity:.45; cursor:default; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; scroll-behavior:auto !important; } }
</style>
</head>
<body>
<div class="stage">
  <h1>Banking customer service agent</h1>
  <p>Pick a test customer and talk to the agent as them. Open a customer to see who they are. The agent asks before it does anything that cannot be undone.</p>
  <div class="find"><input id="search" type="search" placeholder="Search by name or topic" aria-label="Search test customers"></div>
  <div class="areas" id="areas"></div>
  <p class="count" id="count"></p>
  <section class="people" id="people" aria-label="Test customers"></section>
</div>

<aside aria-label="Banking customer service agent">
  <div class="top">
    <div class="mark" aria-hidden="true">C</div>
    <div class="name"><b>Banking customer service agent</b><span id="as">Online</span></div>
    <button class="icon" id="reset" title="Start a new conversation">New chat</button>
  </div>
  <select id="pick" class="pick" aria-label="Test customer"></select>
  <div id="log" aria-live="polite"></div>
  <div class="tips" id="tips"></div>
  <form id="form">
    <textarea id="text" rows="1" placeholder="Message the agent" aria-label="Message"></textarea>
    <button id="send">Send</button>
  </form>
</aside>

<script>
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
let people = [], current = null, convo = null, busy = false, area = "All";
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
const bottom = () => { $("log").scrollTop = $("log").scrollHeight; };
const verifyLine = d => "My phone is " + d.phone + " and my email is " + d.email;
let detail = null;
const titleCase = t => t.charAt(0).toUpperCase() + t.slice(1);

function reset() {
  convo = { id: newId(), first: true };
  $("log").innerHTML = "";
  $("as").textContent = current ? "Chatting as " + current.name : "Online";
  const hi = el("div", "says"); hi.append(el("p", "hello", "How can I help?"), el("p", null, current ? "You are " + current.name + ". Say what they would say." : "Pick a test customer on the left."));
  $("log").append(hi);
}
async function choose(p) {
  current = p; detail = null; $("pick").value = p.id; reset(); drawPeople();
  try { const d = await (await fetch("/personas/" + p.id)).json(); if (current === p) { detail = d; drawPeople(); } } catch (e) { /* the card stays collapsed */ }
}
function drawPeople() {
  const q = $("search").value.trim().toLowerCase();
  const shown = people.filter(p => (area === "All" || p.areas.includes(area)) &&
    (!q || (p.name + " " + p.areas.join(" ")).toLowerCase().includes(q)));
  $("count").textContent = shown.length + " of " + people.length + " test customers";
  const box = $("people"); box.innerHTML = "";
  for (const p of shown) {
    const b = el("button", "person"); b.type = "button"; b.setAttribute("aria-pressed", current && current.id === p.id);
    b.append(el("b", null, p.name), el("div", "tags", p.areas.map(titleCase).join(", ")));
    if (current && current.id === p.id) {
      const d = detail, more = el("div", "more");
      if (!d) more.append(el("p", "about", "Loading..."));
      else {
        const block = (title, text) => { if (!text) return; const w = el("div", "blk"); w.append(el("h3", null, title), el("p", null, text)); more.append(w); };
        block("Who they are", d.character); block("Their situation", d.situation);
        block("To verify, they give", "Phone " + d.phone + ", email " + d.email + ", born " + d.born + ", " + d.address);
        if (d.card_digits && d.card_digits.length) block("If asked, they read from the card", "Last four digits: " + d.card_digits.join(" or "));
        const f = el("div", "fill");
        if (d.opening) { const say = el("span", null, "Use opening line"); say.onclick = e => { e.stopPropagation(); fillBox(d.opening); }; f.append(say); }
        const ver = el("span", null, "Use verification line"); ver.onclick = e => { e.stopPropagation(); fillBox(verifyLine(d)); }; f.append(ver);
        more.append(f);
      }
      b.append(more);
    }
    b.onclick = () => { if (!current || current.id !== p.id) choose(p); };
    box.append(b);
  }
}
function fillBox(text) { $("text").value = text; fit(); $("text").focus(); }
async function load() {
  try { people = await (await fetch("/personas")).json(); } catch (e) { people = []; }
  const areas = ["All", ...[...new Set(people.flatMap(p => p.areas))].sort()];
  $("areas").innerHTML = "";
  for (const a of areas) { const b = el("button", null, titleCase(a)); b.type = "button"; b.setAttribute("aria-pressed", a === area);
    b.onclick = () => { area = a; [...$("areas").children].forEach(x => x.setAttribute("aria-pressed", x === b)); drawPeople(); }; $("areas").append(b); }
  $("pick").innerHTML = people.map(p => "<option value=\"" + p.id + "\">" + p.name + "</option>").join("");
  $("pick").onchange = () => choose(people.find(p => p.id === $("pick").value));
  $("search").oninput = drawPeople;
  if (people.length) choose(people.find(p => p.id === "task_078") || people[0]); else reset();
}

/* ---- turn the assistant's plain text into what a person wants to read ---- */
function clean(text) {
  return text.replace(/To go on, I need a little more information:\s*(\n- )?/g, "").replace(/\n- /g, "\n\n").trim();
}
function parsePlan(text) {
  const at = text.indexOf("Here is exactly what I will do:");
  if (at < 0) return null;
  const before = clean(text.slice(0, at)).replace(/\n+$/, "");
  const body = text.slice(at + 31).replace(/Shall I go ahead\? \(yes or no\)\s*$/, "");
  const steps = [], skipped = [];
  for (const raw of body.split(/\n(?=\d+\. )/)) {
    const line = raw.replace(/^\d+\. /, "").trim(); if (!line) continue;
    const m = line.match(/^(.*?)\s*\(((?:[a-z ]+: [^()]*)(?:, [a-z ]+: [^()]*)*)\)\s*-\s*(can be undone|cannot be undone)\s*$/s);
    let title = m ? m[1] : line, details = m ? m[2] : "", final = m ? m[3] === "cannot be undone" : false;
    const n = title.indexOf(" Not included: ");
    if (n >= 0) { skipped.push(title.slice(n + 15).replace(/\.$/, "")); title = title.slice(0, n).replace(/\.$/, ""); }
    steps.push({ title, details, final });
  }
  return { before, steps, skipped };
}
function planCard(plan) {
  const card = el("div", "card"); card.append(el("header", null, "Review before I do this"));
  for (const s of plan.steps) {
    const row = el("div", "step"), what = el("div", "what"); what.append(el("div", null, s.title));
    if (s.details) { const d = el("details"); d.append(el("summary", null, "Details"), el("p", null, s.details)); what.append(d); }
    row.append(what, el("span", "chip " + (s.final ? "final" : "undo"), s.final ? "Can't be undone" : "Can be undone"));
    card.append(row);
  }
  if (plan.skipped.length) { const n = el("div", "left-out"); n.innerHTML = "<b>Left out for now.</b> "; n.append(plan.skipped.join(" ")); card.append(n); }
  const bar = el("div", "actions"), yes = el("button", "primary", "Yes, go ahead"), no = el("button", "ghost", "No, cancel");
  yes.type = no.type = "button";
  const lock = () => { yes.disabled = no.disabled = true; };
  yes.onclick = () => { lock(); send("Yes, go ahead."); }; no.onclick = () => { lock(); send("No, don't do that."); };
  bar.append(yes, no); card.append(bar); return card;
}
function doneCard(text) {
  const body = text.replace(/^Done: /, "");
  const dot = body.search(/\.\s+(?=[A-Z])/);
  const doneText = dot > 0 ? body.slice(0, dot) : body, after = dot > 0 ? body.slice(dot + 2) : "";
  const card = el("div", "card done"); card.append(el("header", null, "Done"));
  const ul = el("ul"); for (const p of doneText.split(/;\s+/)) { const t = p.replace(/\.$/, "").replace(/\bNot included:.*$/, "").trim(); if (t) ul.append(el("li", null, t)); }
  card.append(ul); if (after) card.append(el("div", "after", after)); return card;
}
function render(into, data) {
  const text = data.reply || "";
  const extra = data.questions.filter(q => !text.includes(q)).join("\n\n");
  const plan = parsePlan(text);
  if (plan) {
    if (plan.before) into.append(el("p", null, plan.before));
    into.append(planCard(plan)); return;
  }
  if (/^Done: /.test(text)) { into.append(doneCard(text)); return; }
  for (const part of [clean(text), extra].filter(Boolean)) into.append(el("p", null, part));
}

async function send(text) {
  if (busy) return; busy = true; $("send").disabled = true;
  const me = el("div", "row me"); me.append(el("div", "bubble", text)); $("log").append(me);
  const wrap = el("div", "says"), dots = el("div", "typing"); dots.append(el("i"), el("i"), el("i")); wrap.append(dots); $("log").append(wrap); bottom();
  const body = { message_id: newId(), message: text };
  if (convo.first && current) body.scenario = current.id;
  try {
    const r = await fetch("/conversations/" + convo.id + "/messages", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error("the server answered " + r.status);
    convo.first = false; const data = await r.json();
    wrap.innerHTML = ""; render(wrap, data);
    if (data.escalated) $("log").append(el("div", "notice", "Passed to a person"));
    if (data.failed) $("log").append(el("div", "notice", "Part of this could not be done"));
  } catch (e) {
    wrap.innerHTML = ""; wrap.append(el("p", null, "That did not go through (" + e.message + "). Send it again."));
  }
  busy = false; $("send").disabled = false; bottom(); $("text").focus();
}
const fit = () => { const t = $("text"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 152) + "px"; };
$("text").addEventListener("input", fit);
$("text").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); } });
$("form").onsubmit = e => { e.preventDefault(); const t = $("text").value.trim(); if (t) { $("text").value = ""; fit(); send(t); } };
$("reset").onclick = reset;
load();
</script>
</body>
</html>
